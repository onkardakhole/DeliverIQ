<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DeliverIQ - Route Optimizer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>DeliverIQ</h1>
    <p class="subtitle">Route Optimization Engine</p>

    <div class="legend">
      <span><span class="dot start"></span> Start</span>
      <span><span class="dot end"></span> End</span>
      <span><span class="dot normal"></span> Node</span>
    </div>
    

    <p id="instructions">Click a node to set START, click another to set END</p>

    <canvas id="mapCanvas" width="600" height="600"></canvas>

    <button id="resetBtn">Reset</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
